name: 问题报告
description: 报告可以稳定复现的功能或数据问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传 API 密钥、数据库、健康记录、复盘原文或版权资料。
  - type: checkboxes
    id: duplicate
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索开放和已关闭 Issue，没有找到相同问题。
          required: true
        - label: 我使用当前 main 或最新源码构建进行了复现。
          required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 例如 0.6.0 或提交哈希
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与硬件
      placeholder: 例如 macOS 15.6，Apple Silicon
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac 型号与架构
      placeholder: 例如 MacBook Air M2，Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动应用开始，列出最短复现路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除密钥、个人数据和无再分发权限的附件。
          required: true
