name: 功能建议
description: 提议新的工作流或改进现有模块
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实使用场景，而不只是界面形式。
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: 期望工作流
      description: 说明输入、操作、结果和失败时的处理。
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 总览与计划
        - 学习与科研
        - 资讯与资料
        - 运动健康
        - 今日复盘
        - 设置、数据与隐私
        - 新模块
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据、联网与 AI 影响
      description: 是否涉及敏感数据、外部服务、附件、自动任务或费用。
