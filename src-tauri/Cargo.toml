[package]
name = "growth-workbench"
version = "0.1.0"
description = "A local-first personal growth workbench"
authors = ["Growth Workbench Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "growth_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
